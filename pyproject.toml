[project]
name = "openextract"
version = "0.5.0"
description = "Extract structured data from documents, images, audio, and video using LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Cole McIntosh" }
]
keywords = ["llm", "extraction", "pydantic", "ai", "document", "structured-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,huggingface,logfire,mistral,openai,openrouter,xai]>=1.37.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
openextract = "openextract._cli:main"

[project.urls]
Homepage = "https://github.com/Mellow-Artificial-Intelligence/openextract"
Documentation = "https://mellow-artificial-intelligence.github.io/openextract/"
Repository = "https://github.com/Mellow-Artificial-Intelligence/openextract"
Issues = "https://github.com/Mellow-Artificial-Intelligence/openextract/issues"
Changelog = "https://github.com/Mellow-Artificial-Intelligence/openextract/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openextract"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP047"]  # TypeVar pattern is valid for pydantic-ai compatibility

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["openextract"]

[tool.coverage.report]
show_missing = true
fail_under = 100
