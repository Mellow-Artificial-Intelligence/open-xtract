title: openextract
description: Extract structured data from documents, images, audio, and video using LLMs
baseurl: "/openextract"
url: "https://mellow-artificial-intelligence.github.io"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-sitemap
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

include:
  - llms.txt

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: "index.html"
    values:
      layout: null
  - scope:
      path: ""
    values:
      layout: page
